# Release configuration for documango. The release workflow runs this on
# every v* tag. Check it locally with:
#
#   goreleaser check
#   goreleaser release --snapshot --clean
version: 2

project_name: documango

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: documango
    main: ./cmd/documango
    binary: documango
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: documango
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes come from CHANGELOG.md (see .github/scripts/release-notes.sh).
changelog:
  disable: true

release:
  github:
    owner: desertthunder
    name: documango
  prerelease: auto
