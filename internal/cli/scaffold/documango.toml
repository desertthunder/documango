# Settings for the {{.Title}} docs site. Uncomment a line to use it.

title = {{quote .Title}}

# One sentence about the project, used by search engines and link previews.
# description = ""

# The address the site is published at. Enables canonical links and feeds.
# url = "https://example.com/docs/"

# The URL path the site lives under, if not the root of its domain.
# base_path = "/docs/"

# The author named in each page's metadata.
# author = ""

# The language of the pages, as an HTML language code.
# language = "en"

# Image files in this folder to use as the browser tab icon and header logo.
# favicon = "favicon.svg"
# logo = "logo.svg"

# Markdown shown at the foot of every page. Set it to "" to remove the footer.
# footer = """
# Copyright Acme. Read the [guide](guide/index.md).
# """

# Files to publish even when no page links to them. Files a page links to
# are always published.
# include = ["downloads/**", "*.pdf"]

[theme]
# Color themes for dark and light mode. Run 'documango themes' to list them.
dark = "tomorrow-night"
light = "tomorrow"
# The search engine: pagefind (downloaded on first use) or builtin (no download).
# search = "pagefind"

# Links shown in the site header. Repeat the block to add more.
# [[links]]
# title = "GitHub"
# url = "https://github.com/you/project"
